<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<title>班级事务工作台</title>
<style>
  :root {
    --bg: #f4f5fb; --card: #fff; --ink: #1f2333; --muted: #6b7086;
    --line: #e6e8f0; --accent: #4f46e5; --ok: #16a34a; --warn: #d97706; --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 { font-size: 24px; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-top: 18px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  .scenarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .scard {
    text-align: left; border: 1px solid var(--line); background: #fafaff; border-radius: 12px;
    padding: 12px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 5px;
  }
  .scard:hover { border-color: #c9c6ff; }
  .scard.active { border-color: var(--accent); box-shadow: 0 0 0 3px #e8e6ff; background: #fff; }
  .scard .st { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .scard .stag { font-size: 11px; font-weight: 400; color: #6b6f86; background: #eef0f8; border-radius: 999px; padding: 1px 7px; }
  .scard .sd { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; color: #40465c; margin-bottom: 6px; }
  input, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid #d8dbe8; border-radius: 9px;
    font: inherit; font-size: 14px; background: #fbfbff; color: var(--ink);
  }
  input:focus, textarea:focus { outline: 2px solid #c7c4ff; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; font-size: 14px; }
  .primary { background: var(--accent); color: #fff; }
  .primary:disabled { opacity: .55; cursor: progress; }
  .ghost { background: #eef0f8; color: #3c4258; }
  .ghost:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 7px; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px; font-size: 13px; color: var(--muted); background: #fafaff;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #c8cce0; }
  .chip.running { color: #8a5a00; border-color: #f1dca8; background: #fffaf0; }
  .chip.running .dot { background: var(--warn); animation: pulse 1s infinite; }
  .chip.ok { color: #12703a; border-color: #c8edd5; background: #f3fdf7; }
  .chip.ok .dot { background: var(--ok); }
  .chip.err { color: #a11d1d; border-color: #f3c9c9; background: #fff5f5; }
  .chip.err .dot { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  #status { color: var(--muted); font-size: 13px; margin-left: auto; }
  .toolbar { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 10px; }
  .md h1 { font-size: 22px; margin: 18px 0 10px; padding-bottom: 8px; border-bottom: 2px solid #eceefb; }
  .md h2 { font-size: 19px; margin: 22px 0 10px; color: #333a52; }
  .md h3 { font-size: 16px; margin: 18px 0 8px; color: #4a5170; }
  .md p { margin: 8px 0; line-height: 1.75; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; line-height: 1.8; }
  .md blockquote {
    margin: 10px 0; padding: 12px 16px; border-left: 3px solid #c9c6ff;
    background: #f8f8ff; border-radius: 0 8px 8px 0; color: #454b63;
  }
  .md code { background: #f0f1fa; padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .md .tbl { overflow-x: auto; margin: 12px 0; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .md th, .md td { border: 1px solid #e3e5f0; padding: 7px 10px; text-align: left; vertical-align: top; }
  .md th { background: #f6f6ff; font-weight: 600; white-space: nowrap; }
  .md tr:nth-child(even) td { background: #fbfbfe; }
  .md hr { border: 0; border-top: 1px solid #e9eaf2; margin: 18px 0; }
  .banner {
    display: none; margin-top: 14px; padding: 10px 14px; border-radius: 10px;
    background: #fff7e6; border: 1px solid #f3d9a4; color: #8a5a00; font-size: 13px;
  }
  .banner.show { display: block; }
  .warn { margin-bottom: 14px; background: #fff5f5; border-color: #f3c9c9; color: #a11d1d; }
  .codebox { margin-bottom: 14px; }
  .code-row { display: flex; gap: 8px; }
  .code-row input { flex: 1; }
  .foot { color: #8b90a6; font-size: 12.5px; margin-top: 22px; line-height: 1.7; }
  details.more { margin-top: 4px; }
  details.more summary {
    cursor: pointer; font-size: 13px; color: #4f46e5; padding: 4px 0; user-select: none;
  }
  details.more summary:hover { text-decoration: underline; }
  details.more[open] summary { margin-bottom: 10px; }
  /* 智能助手 */
  .chat-fab {
    position: fixed; right: 18px; bottom: 18px; z-index: 80;
    border: 0; border-radius: 999px; background: var(--accent); color: #fff;
    padding: 12px 18px; font-size: 14px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(79, 70, 229, .35);
  }
  .chat-panel {
    position: fixed; right: 18px; bottom: 76px; z-index: 90;
    width: 380px; max-width: calc(100vw - 36px); height: 500px; max-height: 72vh;
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 20px 60px rgba(16, 24, 40, .22);
    display: none; flex-direction: column; overflow: hidden;
  }
  .chat-panel.show { display: flex; }
  .chat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    font-weight: 600; font-size: 14px;
  }
  .chat-head button { padding: 4px 10px; font-size: 12px; }
  .chat-head-actions { display: flex; gap: 6px; }
  #chat-task.active { background: var(--accent); color: #fff; }
  .task-steps { margin-top: 8px; font-size: 12.5px; }
  .task-steps summary { cursor: pointer; color: var(--accent); }
  .task-steps .step { margin-top: 8px; padding-left: 8px; border-left: 2px solid #e6e8f0; }
  .task-steps .step strong { display: block; margin-bottom: 4px; }
  .chat-body {
    flex: 1; overflow-y: auto; padding: 12px; background: #fafaff;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 90%; padding: 9px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.bot .md p { margin: 6px 0; }
  .msg.bot .md table { font-size: 12.5px; }
  .msg.bot .md h1, .msg.bot .md h2, .msg.bot .md h3 { font-size: 14px; margin: 10px 0 6px; border: 0; padding: 0; }
  .msg.bot .md ul, .msg.bot .md ol { padding-left: 18px; }
  .msg.bot .md .tbl { margin: 8px 0; }
  .msg.bot .md blockquote { padding: 8px 10px; margin: 8px 0; }
  .msg.pending { color: var(--muted); }
  .chat-foot { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: #fff; }
  .chat-foot textarea { flex: 1; min-height: 44px; max-height: 110px; padding: 10px 11px; }
  .chat-foot button { padding: 0 18px; }

  .attach-list { display: none; gap: 6px; flex-wrap: wrap; padding: 8px 10px 0; background: #fff; }
  .attach-list.show { display: flex; }
  .attach { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: #eef0f8; border-radius: 999px; padding: 3px 8px; }
  .attach button { border: 0; background: transparent; cursor: pointer; font-size: 12px; color: #6b7086; padding: 0 2px; }
  .attach-btn { padding: 0 9px; }
  .msg-actions { display: flex; gap: 6px; margin-top: 6px; }
  .msg-actions button { padding: 3px 8px; font-size: 11.5px; }

  .prefs { margin-top: 12px; }
  .pref-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip-btn {
    border: 1px solid #d8dbe8; background: #fbfbff; color: #40465c;
    border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer;
  }
  .chip-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  @media (max-width: 640px) {
    .wrap { padding: 18px 12px 40px; }
    header h1 { font-size: 20px; }
    .card { padding: 16px 14px; border-radius: 12px; }
    #status { margin-left: 0; width: 100%; }
    .toolbar { justify-content: stretch; }
    .toolbar button { flex: 1; }
    input, textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>班级事务工作台</h1>
    <p>选一件事，多个智能体并行处理，最后合成一份能直接用的成果。</p>
  </header>

  <section class="card">
    <div class="scenarios" id="scenarios"></div>
  </section>

  <form id="plan-form" class="card">
    <div class="codebox" id="codebox" hidden>
      <label for="code">访问口令（老师或班长给你的）</label>
      <div class="code-row">
        <input id="code" type="password" placeholder="输入口令后会自动记住" autocomplete="off">
        <button type="button" class="ghost" id="save-code">记住</button>
      </div>
    </div>
    <div class="banner warn" id="warn"></div>
    <details class="more">
      <summary>填写细节（已预填示例，不改也能直接生成）</summary>
      <div class="grid" id="fields"></div>
    </details>
    <div class="prefs">
      <label for="prefs">生成偏好（可选，会直接影响写法）</label>
      <div class="pref-chips" id="pref-chips">
        <button type="button" class="chip-btn" data-pref="简洁，少写套话">简洁</button>
        <button type="button" class="chip-btn" data-pref="详细，给出完整细节和示例">详细</button>
        <button type="button" class="chip-btn" data-pref="语气正式，适合发给辅导员">正式</button>
        <button type="button" class="chip-btn" data-pref="语气轻松，适合发班级群">轻松</button>
        <button type="button" class="chip-btn" data-pref="以表格为主">表格优先</button>
        <button type="button" class="chip-btn" data-pref="直接给能复制使用的成品，不要解释">只要成品</button>
      </div>
      <input id="prefs" placeholder="例如：控制在一页内；重点写预算；不要宣传部分">
    </div>
    <div class="row">
      <button type="submit" class="primary" id="go">生成</button>
      <button type="button" class="ghost" id="reset">重置为示例</button>
      <span id="status">选择一件事开始</span>
    </div>
    <div class="banner" id="mock">演示模式：没有检测到 DEEPSEEK_API_KEY，返回的是简版示例。设置密钥后重启服务即可真实生成。</div>
  </form>

  <section class="card">
    <div class="chips" id="chips"></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="toolbar">
      <button type="button" class="ghost" id="copy" disabled>复制</button>
      <button type="button" class="ghost" id="download" disabled>下载 .md</button>
    </div>
    <div class="md" id="content"></div>
  </section>

  <p class="foot">
    提示：服务只监听 127.0.0.1（部署后由平台托管），密钥放在环境变量里，不写进网页。
    涉及成绩、家庭情况、学生心理状态的材料，请先脱敏再粘贴。AI 生成的日期、预算、审批要求请人工核对。
  </p>
</div>

<button type="button" class="chat-fab" id="chat-fab">🤖 问助手</button>
<div class="chat-panel" id="chat-panel">
  <div class="chat-head">
    <span>班级事务助手</span>
    <div class="chat-head-actions">
      <button type="button" class="ghost" id="chat-task" title="任务模式：自动拆步骤再执行">🧩 任务</button>
      <button type="button" class="ghost" id="chat-close">关闭</button>
    </div>
  </div>
  <div class="chat-body" id="chat-body"></div>
  <div class="attach-list" id="attach-list"></div>
  <div class="chat-foot">
    <button type="button" class="ghost attach-btn" id="chat-attach" title="上传文本文件（txt/md/csv/json/log）">📎</button>
    <input type="file" id="chat-file" multiple accept=".txt,.md,.markdown,.csv,.json,.log" hidden>
    <textarea id="chat-input" rows="1" placeholder="描述你要什么，或上传文件让我照着做"></textarea>
    <button type="button" class="primary" id="chat-send">发送</button>
  </div>
</div>

<script type="module">
import { mdToHtml } from './md.js';

const $ = (id) => document.getElementById(id);

// ── 兼容层：老浏览器 / 手机内置浏览器也能用 ──────────────────
function storeGet(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
function storeSet(key, value) {
  try { window.localStorage.setItem(key, value); } catch (e) { /* 隐私模式忽略 */ }
}
function storeDel(key) {
  try { window.localStorage.removeItem(key); } catch (e) { /* 忽略 */ }
}
const hasFetch = typeof window.fetch === 'function';

function getJson(url) {
  return new Promise((resolve, reject) => {
    if (hasFetch) {
      fetch(url).then((r) => r.json()).then(resolve).catch(reject);
      return;
    }
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = () => {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
      } else {
        reject(new Error('HTTP ' + xhr.status));
      }
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.send();
  });
}

function consumeText(text) {
  text.split('\n').forEach((line) => {
    if (!line.trim()) return;
    try { handleEvent(JSON.parse(line)); } catch (e) { /* 跳过坏行 */ }
  });
}

function fetchPlan(brief, headers) {
  return fetch('/api/plan', {
    method: 'POST',
    headers,
    body: JSON.stringify({
      scenarioId: current.id,
      brief,
      prefs: $('prefs') ? $('prefs').value.trim() : '',
    }),
  }).then((res) => {
    if (!res.ok) {
      return res.text().then((text) => {
        let msg = 'HTTP ' + res.status;
        try { const data = JSON.parse(text); if (data && data.error) msg = data.error; } catch (e) { /* ignore */ }
        if (res.status === 401) codebox.hidden = false;
        throw new Error(msg);
      });
    }
    const canStream = res.body && typeof res.body.getReader === 'function' && typeof TextDecoder !== 'undefined';
    if (canStream) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      const pump = () => reader.read().then(({ value, done }) => {
        if (done) {
          if (buffer.trim()) consumeText(buffer);
          return undefined;
        }
        buffer += decoder.decode(value, { stream: true });
        const idx = buffer.lastIndexOf('\n');
        if (idx >= 0) {
          consumeText(buffer.slice(0, idx));
          buffer = buffer.slice(idx + 1);
        }
        return pump();
      });
      return pump();
    }
    statusEl.textContent = '正在生成（当前浏览器不支持进度显示），请稍候 30–60 秒…';
    return res.text().then(consumeText);
  });
}

function xhrPlan(brief, headers) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/plan', true);
    Object.keys(headers).forEach((k) => xhr.setRequestHeader(k, headers[k]));
    xhr.onreadystatechange = () => {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        consumeText(xhr.responseText);
        resolve();
        return;
      }
      let msg = 'HTTP ' + xhr.status;
      try { const data = JSON.parse(xhr.responseText); if (data && data.error) msg = data.error; } catch (e) { /* ignore */ }
      if (xhr.status === 401) codebox.hidden = false;
      reject(new Error(msg));
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.send(JSON.stringify({
      scenarioId: current.id,
      brief,
      prefs: $('prefs') ? $('prefs').value.trim() : '',
    }));
  });
}

function postPlan(brief, headers) {
  return hasFetch ? fetchPlan(brief, headers) : xhrPlan(brief, headers);
}

let scenarios = [];
let current = null;
let finalMd = '';
let lastError = null;
let accessCode = storeGet('plan_access_code') || '';

const chipMap = new Map();
const codebox = $('codebox');
const codeInput = $('code');
const statusEl = $('status');
const resultEl = $('result');
const contentEl = $('content');
const mockEl = $('mock');
const warnEl = $('warn');
const goBtn = $('go');
const copyBtn = $('copy');
const downloadBtn = $('download');

function setChip(key, state) {
  const el = chipMap.get(key);
  if (!el) return;
  el.classList.remove('running', 'ok', 'err');
  if (state) el.classList.add(state);
}

function renderScenarioCards() {
  const box = $('scenarios');
  box.innerHTML = '';
  for (const s of scenarios) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'scard';
    btn.dataset.id = s.id;
    const st = document.createElement('div');
    st.className = 'st';
    const title = document.createElement('span');
    title.textContent = s.title;
    const tag = document.createElement('span');
    tag.className = 'stag';
    tag.textContent = s.tag;
    st.appendChild(title);
    st.appendChild(tag);
    const desc = document.createElement('div');
    desc.className = 'sd';
    desc.textContent = s.desc;
    btn.appendChild(st);
    btn.appendChild(desc);
    btn.addEventListener('click', () => selectScenario(s));
    box.appendChild(btn);
  }
}

function renderFields() {
  const grid = $('fields');
  grid.innerHTML = '';
  for (const f of current.fields) {
    const wrap = document.createElement('div');
    if (f.type === 'textarea') wrap.className = 'full';
    const label = document.createElement('label');
    label.htmlFor = 'f_' + f.id;
    label.textContent = f.label;
    const input = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
    input.id = 'f_' + f.id;
    input.value = f.value || '';
    wrap.appendChild(label);
    wrap.appendChild(input);
    grid.appendChild(wrap);
  }
}

function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  chipMap.clear();
  const items = [
    ...current.dimensions.map((d) => ({ key: d.key, label: d.label })),
    { key: 'merge', label: '合成成果' },
  ];
  for (const a of items) {
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = '<span class="dot"></span><span></span>';
    el.lastElementChild.textContent = a.label;
    box.appendChild(el);
    chipMap.set(a.key, el);
  }
}

function selectScenario(s) {
  current = s;
  storeSet('planner_scenario', s.id);
  const cards = document.querySelectorAll('.scard');
  for (let i = 0; i < cards.length; i++) {
    cards[i].className = cards[i].getAttribute('data-id') === s.id ? 'scard active' : 'scard';
  }
  renderFields();
  renderChips();
  resultEl.hidden = true;
  contentEl.innerHTML = '';
  finalMd = '';
  lastError = null;
  warnEl.textContent = s.warning || '';
  warnEl.classList.toggle('show', Boolean(s.warning));
  mockEl.classList.remove('show');
  statusEl.textContent = '填好后点生成';
  copyBtn.disabled = true;
  downloadBtn.disabled = true;
}

function buildBrief() {
  return current.fields
    .map((f) => {
      const el = $('f_' + f.id);
      const value = el ? el.value.trim() : '';
      return value ? `${f.label}：${value}` : '';
    })
    .filter(Boolean)
    .join('\n');
}

function setBusy(busy) {
  goBtn.disabled = busy;
  goBtn.textContent = busy ? '生成中…' : '生成';
  copyBtn.disabled = busy || !finalMd;
  downloadBtn.disabled = busy || !finalMd;
}

function handleEvent(ev) {
  if (ev.type === 'start') {
    mockEl.classList.toggle('show', Boolean(ev.mock));
    statusEl.textContent = ev.mock ? '演示模式生成中…' : '多个智能体并行工作中…';
  } else if (ev.type === 'agent') {
    setChip(ev.key, ev.status);
  } else if (ev.type === 'final') {
    finalMd = ev.text || '';
    contentEl.innerHTML = mdToHtml(finalMd);
    resultEl.hidden = false;
    statusEl.textContent = '完成 · 可以复制或下载';
  } else if (ev.type === 'error') {
    lastError = ev.message || '未知错误';
  }
}

$('plan-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!current) return;
  const brief = buildBrief();
  if (brief.length < 5) {
    statusEl.textContent = '内容太短了，至少写 5 个字';
    return;
  }

  finalMd = '';
  lastError = null;
  resultEl.hidden = true;
  contentEl.innerHTML = '';
  renderChips();
  setBusy(true);
  statusEl.textContent = '正在连接…';

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (accessCode) headers['X-Access-Code'] = accessCode;
    if (!hasFetch) statusEl.textContent = '正在生成（兼容模式），请稍候 30–60 秒…';

    await postPlan(brief, headers);

    if (lastError) statusEl.textContent = '出错：' + lastError;
    else if (!finalMd) statusEl.textContent = '没有拿到结果，请重试';
  } catch (err) {
    statusEl.textContent = '出错：' + (err.message || err);
  } finally {
    setBusy(false);
  }
});

$('reset').addEventListener('click', () => {
  if (!current) return;
  renderFields();
  finalMd = '';
  lastError = null;
  resultEl.hidden = true;
  contentEl.innerHTML = '';
  renderChips();
  mockEl.classList.remove('show');
  statusEl.textContent = '已重置为示例，可修改后生成';
  copyBtn.disabled = true;
  downloadBtn.disabled = true;
  const prefInput = $('prefs');
  if (prefInput) prefInput.value = '';
  Array.prototype.forEach.call(document.querySelectorAll('.chip-btn'), (b) => b.classList.remove('on'));
});

async function copyText(text) {
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { /* 走降级方案 */ }
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { /* 忽略 */ }
    document.body.removeChild(ta);
  }
  return ok;
}

function downloadText(text, filename) {
  try {
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) {
    statusEl.textContent = '浏览器不支持下载，请手动复制';
  }
}

copyBtn.addEventListener('click', async () => {
  if (!finalMd) return;
  const ok = await copyText(finalMd);
  if (ok) {
    copyBtn.textContent = '已复制';
    setTimeout(() => (copyBtn.textContent = '复制'), 1500);
  } else {
    statusEl.textContent = '浏览器不允许复制，请手动选择文本';
  }
});

downloadBtn.addEventListener('click', () => {
  if (!finalMd) return;
  const name = current ? current.title : '班级事务';
  downloadText(finalMd, name + '-成果.md');
});

$('save-code').addEventListener('click', () => {
  accessCode = codeInput.value.trim();
  if (accessCode) storeSet('plan_access_code', accessCode);
  else storeDel('plan_access_code');
  statusEl.textContent = accessCode ? '口令已记住，可以生成了' : '已清除口令';
});

getJson('/config')
  .then((cfg) => {
    if (cfg.needCode) {
      codebox.hidden = false;
      if (accessCode) codeInput.value = accessCode;
    }
  })
  .catch(() => {});

// ── 智能助手 ──────────────────────────────────────────────
const chatFab = $('chat-fab');
const chatPanel = $('chat-panel');
const chatBody = $('chat-body');
const chatInput = $('chat-input');
const chatSend = $('chat-send');
let chatHistory = [];
let chatBusy = false;

const chatAttach = $('chat-attach');
const chatFile = $('chat-file');
const attachList = $('attach-list');
let chatAttachments = [];

function renderAttachments() {
  attachList.innerHTML = '';
  if (!chatAttachments.length) {
    attachList.classList.remove('show');
    return;
  }
  attachList.classList.add('show');
  chatAttachments.forEach((f, idx) => {
    const chip = document.createElement('span');
    chip.className = 'attach';
    chip.textContent = f.name;
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.textContent = '×';
    rm.addEventListener('click', () => {
      chatAttachments.splice(idx, 1);
      renderAttachments();
    });
    chip.appendChild(rm);
    attachList.appendChild(chip);
  });
}

function addFiles(fileList) {
  const list = Array.prototype.slice.call(fileList);
  list.forEach((file) => {
    if (file.size > 200 * 1024) {
      statusEl.textContent = '文件太大（上限 200KB）：' + file.name;
      return;
    }
    if (!/\.(txt|md|markdown|csv|json|log)$/i.test(file.name)) {
      statusEl.textContent = '只支持文本类文件（txt/md/csv/json/log）：' + file.name;
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      chatAttachments.push({ name: file.name, content: String(reader.result).slice(0, 20000) });
      renderAttachments();
    };
    reader.onerror = () => {
      statusEl.textContent = '读取文件失败：' + file.name;
    };
    reader.readAsText(file);
  });
}

function addMsgActions(container, text) {
  const bar = document.createElement('div');
  bar.className = 'msg-actions';
  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'ghost';
  copy.textContent = '复制';
  copy.addEventListener('click', async () => {
    const ok = await copyText(text);
    copy.textContent = ok ? '已复制' : '失败';
    setTimeout(() => (copy.textContent = '复制'), 1200);
  });
  const dl = document.createElement('button');
  dl.type = 'button';
  dl.className = 'ghost';
  dl.textContent = '下载 .md';
  dl.addEventListener('click', () => downloadText(text, '助手回复.md'));
  bar.appendChild(copy);
  bar.appendChild(dl);
  container.appendChild(bar);
}

function chatHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (accessCode) h['X-Access-Code'] = accessCode;
  return h;
}

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'user') div.textContent = text;
  else div.innerHTML = '<div class="md">' + mdToHtml(text) + '</div>';
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
  return div;
}

function postChat(payload, url) {
  const target = url || '/api/chat';
  const body = JSON.stringify(payload);
  if (hasFetch) {
    return fetch(target, { method: 'POST', headers: chatHeaders(), body }).then((res) =>
      res.text().then((text) => {
        if (!res.ok) {
          let msg = 'HTTP ' + res.status;
          try { const d = JSON.parse(text); if (d && d.error) msg = d.error; } catch (e) { /* ignore */ }
          if (res.status === 401) codebox.hidden = false;
          throw new Error(msg);
        }
        return JSON.parse(text);
      }),
    );
  }
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', target, true);
    const h = chatHeaders();
    Object.keys(h).forEach((k) => xhr.setRequestHeader(k, h[k]));
    xhr.onreadystatechange = () => {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
        return;
      }
      let msg = 'HTTP ' + xhr.status;
      try { const d = JSON.parse(xhr.responseText); if (d && d.error) msg = d.error; } catch (e) { /* ignore */ }
      if (xhr.status === 401) codebox.hidden = false;
      reject(new Error(msg));
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.send(body);
  });
}

const chatTask = $('chat-task');
let taskMode = false;
chatTask.addEventListener('click', () => {
  taskMode = !taskMode;
  chatTask.classList.toggle('active', taskMode);
  statusEl.textContent = taskMode ? '任务模式：会自动拆步骤再合成' : '对话模式';
});

async function sendTask(goal) {
  const files = chatAttachments.slice();
  const suffix = files.length ? '\n\n（附带文件：' + files.map((f) => f.name).join('、') + '）' : '';
  const display = goal + suffix;
  chatInput.value = '';
  chatAttachments = [];
  renderAttachments();
  appendMsg('user', display);
  chatBusy = true;
  chatSend.disabled = true;
  const pending = appendMsg('bot', '正在拆解任务并逐步执行，约 1–2 分钟…');
  pending.classList.add('pending');
  try {
    const data = await postChat({ goal: display, brief: current ? buildBrief() : '', files }, '/api/agent');
    pending.classList.remove('pending');
    pending.innerHTML = '<div class="md">' + mdToHtml(data.final || '（没有结果）') + '</div>';
    addMsgActions(pending, data.final || '');
    if (data.steps && data.steps.length) {
      const det = document.createElement('details');
      det.className = 'task-steps';
      const sum = document.createElement('summary');
      sum.textContent = '查看分步产出（' + data.steps.length + ' 步）';
      det.appendChild(sum);
      data.steps.forEach((s, i) => {
        const box = document.createElement('div');
        box.className = 'step';
        const head = document.createElement('strong');
        head.textContent = (i + 1) + '. ' + s.label;
        const body = document.createElement('div');
        body.className = 'md';
        body.innerHTML = mdToHtml(s.text || '');
        box.appendChild(head);
        box.appendChild(body);
        det.appendChild(box);
      });
      pending.appendChild(det);
    }
    chatHistory.push({ role: 'assistant', content: data.final || '' });
  } catch (err) {
    pending.classList.remove('pending');
    pending.textContent = '出错：' + (err.message || err);
  } finally {
    chatBusy = false;
    chatSend.disabled = false;
    chatBody.scrollTop = chatBody.scrollHeight;
  }
}

async function sendChat() {
  if (chatBusy) return;
  const text = chatInput.value.trim();
  if (!text && chatAttachments.length === 0) return;
  if (taskMode) {
    await sendTask(text || '（见附件）');
    return;
  }
  const files = chatAttachments.slice();
  const suffix = files.length ? '\n\n（附带文件：' + files.map((f) => f.name).join('、') + '）' : '';
  const display = (text || '（见附件）') + suffix;
  chatInput.value = '';
  chatAttachments = [];
  renderAttachments();
  appendMsg('user', display);
  chatHistory.push({ role: 'user', content: display });
  chatBusy = true;
  chatSend.disabled = true;
  const pending = appendMsg('bot', '正在思考…');
  pending.classList.add('pending');
  try {
    const brief = current ? buildBrief() : '';
    const data = await postChat({ messages: chatHistory.slice(-10), brief, files });
    pending.classList.remove('pending');
    pending.innerHTML = '<div class="md">' + mdToHtml(data.reply || '（没有回复）') + '</div>';
    addMsgActions(pending, data.reply || '');
    chatHistory.push({ role: 'assistant', content: data.reply || '' });
  } catch (err) {
    pending.classList.remove('pending');
    pending.textContent = '出错：' + (err.message || err);
  } finally {
    chatBusy = false;
    chatSend.disabled = false;
    chatBody.scrollTop = chatBody.scrollHeight;
  }
}

chatFab.addEventListener('click', () => {
  chatPanel.classList.toggle('show');
  if (chatPanel.classList.contains('show')) {
    if (chatBody.childElementCount === 0) {
      appendMsg(
        'bot',
        '你好，我是班级事务助手。\n\n可以直接说需求，比如：\n- 「写个防诈骗主题班会的通知，下周三晚 7 点，45 人」\n- 「帮我做一个奖学金材料核对表」\n- 「这周有哪些事要跟进，帮我列个周报」\n\n也可以点 📎 上传文件（txt / md / csv / json），让我照着文件内容做。',
      );
    }
    chatInput.focus();
  }
});

$('chat-close').addEventListener('click', () => chatPanel.classList.remove('show'));
chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendChat();
  }
});
chatAttach.addEventListener('click', () => chatFile.click());
chatFile.addEventListener('change', () => {
  addFiles(chatFile.files);
  chatFile.value = '';
});

Array.prototype.forEach.call(document.querySelectorAll('.chip-btn'), (btn) => {
  btn.addEventListener('click', () => {
    const val = btn.getAttribute('data-pref');
    const input = $('prefs');
    const parts = input.value.split('；').map((s) => s.trim()).filter(Boolean);
    const idx = parts.indexOf(val);
    if (idx >= 0) {
      parts.splice(idx, 1);
      btn.classList.remove('on');
    } else {
      parts.push(val);
      btn.classList.add('on');
    }
    input.value = parts.join('；');
  });
});

async function boot() {
  try {
    const data = await getJson('/scenarios');
    scenarios = data.scenarios || [];
    renderScenarioCards();
    const savedId = storeGet('planner_scenario');
    let saved = null;
    for (let i = 0; i < scenarios.length; i++) {
      if (scenarios[i].id === savedId) { saved = scenarios[i]; break; }
    }
    selectScenario(saved || scenarios[0]);
  } catch (e) {
    statusEl.textContent = '加载场景失败，请确认服务已启动';
  }
}

boot();
</script>
